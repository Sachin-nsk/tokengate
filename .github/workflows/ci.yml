name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gateway } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: gateway/go.mod, cache-dependency-path: gateway/go.mod }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.15.0, working-directory: gateway }

  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with: { python-version: "3.14" }
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest -q

  images:
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f deploy/docker-compose.yml config -q
      - run: docker build -t tokengate-gateway:ci gateway
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tokengate-gateway:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
