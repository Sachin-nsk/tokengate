[project]
name = "tokengate-ai"
version = "0.1.0"
description = "Tokengate Python AI services: shadow judge, router training, traffic generator"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.4",
]

[project.scripts]
tokengate-ai = "tokengate_ai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.format]
line-ending = "lf"
